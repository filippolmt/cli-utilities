version: 2
project_name: fritzbox-pp-cli
changelog:
  disable: true
builds:
  - id: fritzbox-pp-cli
    main: ./cmd/fritzbox-pp-cli
    binary: fritzbox-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X fritzbox-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: fritzbox-pp-mcp
    main: ./cmd/fritzbox-pp-mcp
    binary: fritzbox-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: fritzbox-pp-cli
    repository:
      owner: filippolmt
      name: homebrew-tap
    homepage: "https://github.com/filippolmt/fritzbox-pp-cli"
    description: "Every FRITZ!Box feature the shell scripts have, plus a local database that remembers what your router forgets."
    install: |
      bin.install "fritzbox-pp-cli"
      bin.install "fritzbox-pp-mcp"
